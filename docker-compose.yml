version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lapor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: lapor_lingkungan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lapor-be-network
    # Tambahkan ini agar Docker tahu kapan DB sudah siap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lapor_lingkungan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lapor-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: rahasia
      DB_NAME: lapor_lingkungan
      DB_PORT: 5432
      JWT_SECRET: rahasia_negara_123
      TZ: Asia/Jakarta
      # TAMBAHKAN INI (Sesuaikan dengan nama bucket kamu yang asli)
      GCS_BUCKET_NAME: lapor-bucket-agiel
    depends_on:
      db:
        condition: service_healthy # Backend nunggu DB 'sehat' baru jalan
    networks:
      - lapor-be-network

volumes:
  pgdata:

networks:
  lapor-be-network:
    driver: bridge