version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lapor-db # Memberi nama spesifik agar mudah diidentifikasi
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: lapor_lingkungan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lapor-be-network

  backend:
    build: . # Titik (.) berarti build dari Dockerfile di folder ini
    container_name: lapor-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: rahasia
      DB_NAME: lapor_lingkungan
      DB_PORT: 5432
      JWT_SECRET: rahasia_negara_123
    depends_on:
      - db
    networks:
      - lapor-be-network

volumes:
  pgdata:

networks:
  lapor-be-network:
    driver: bridge