server {
    listen 80;

    # 1. Melayani file statis hasil build React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Sakti: Mengarahkan trafik /api ke Backend Go
    location /api/ {
        # Menghapus /api dari URL sebelum dikirim ke Go
        # Contoh: /api/login di browser -> menjadi /login di Backend Go
        #rewrite ^/api/(.*)$ /$1 break; 

        proxy_pass http://10.0.1.3:8080; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}