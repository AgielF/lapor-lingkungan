name: Deploy Frontend to GCP

on:
  push:
    branches: [ fe ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lapor-frontend:latest
          # Menyuntikkan IP Backend ke dalam React saat proses build
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH to Frontend VM and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_FE_IP }} # IP Publik VM Frontend
          username: ${{ secrets.GCP_SSH_USER }} # Contoh: agielnanda2004
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd ~/deploy-frontend
            
            # Login ulang jika perlu (opsional)
            # echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            echo "Menarik image frontend terbaru..."
            docker compose pull
            
            echo "Menjalankan ulang container frontend..."
            docker compose up -d
            
            echo "Pembersihan image lama..."
            docker image prune -f
            
            echo "Frontend Berhasil Di-update! 🚀"